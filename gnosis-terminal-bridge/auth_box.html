<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gnozis Auth Box</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px}
    .box{border:1px solid #ddd;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}
    button{width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer;font-size:16px}
    .note{font-size:14px;color:#666;line-height:1.5}
  </style>
</head>
<body>
  <main class="box">
    <h1>Gnozis Auth Box</h1>
    <p>Authenticate through GitHub. Do not paste a GitHub access token into this page.</p>
    <button id="github">Continue with GitHub</button>
    <p class="note" id="status">The authentication URL must be generated by the Gnozis backend with a registered GitHub App/OAuth client, state, and PKCE parameters.</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const authUrl = params.get('auth_url');

    document.getElementById('github').onclick = () => {
      if (!authUrl) {
        document.getElementById('status').textContent =
          'Authentication is not configured yet. The backend must generate the GitHub authorization URL.';
        return;
      }

      document.getElementById('status').textContent =
        'Redirecting to GitHub for authorization...';
      location.href = authUrl;
    };
  </script>
</body>
</html>
