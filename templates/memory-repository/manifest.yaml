source_id: gnozis-<domain>
protocol: gnozis-memory-source-v0.1
domain: <DOMAIN>
status: draft
trust:
  authority: none
  evidence: external
permissions:
  read: true
  annotate: true
  propose: true
  publish: false
  delete: false
  rewrite_history: false
sync:
  mode: pull
provenance:
  required: true
  revision: required
  content_digest: required
verification:
  required_before_consumption: true
