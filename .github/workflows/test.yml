name: Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests and capture report
        run: |
          python -m pytest -q 2>&1 | tee pytest-output.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Run SPT benchmark
        run: python -m research.spt_benchmark_runner

      - name: Evaluate SPT acceptance
        run: python -m research.run_spt_experiment

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-output.txt
          if-no-files-found: error

      - name: Upload SPT benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spt-benchmark
          path: research/artifacts/spt_benchmark.json
          if-no-files-found: error
