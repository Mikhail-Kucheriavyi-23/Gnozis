name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run core tests
        run: |
          python -m pytest -q
      - name: Run TEST-10
        run: |
          python research/psi_test10.py
      - name: Run TEST-11 after TEST-10
        run: |
          python research/psi_test11.py
      - name: Run TEST-12 after TEST-11
        run: |
          python research/psi_test12.py
      - name: Run TEST-13 after TEST-12
        run: |
          python research/psi_test13.py
