id: C-0163
type: claim
status: FORMALIZED
title: Generator diversity does not establish epistemic independence when generators share assumptions, models, data, or control dependencies
scope: Research Library provenance and verification history; concerns challenge-generator independence, common-mode failure, shared assumptions, implementation diversity, and blind spots.
statement: Distinct implementations or independently developed challenge generators do not by themselves establish epistemic independence. Generators can share models, training data, assumptions, abstractions, priors, selection policies, or upstream control dependencies and therefore reproduce common blind spots. Independence claims require analysis of relevant shared dependencies, not merely code or organizational separation.
