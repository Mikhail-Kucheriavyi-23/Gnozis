id: C-0026
type: claim
status: FORMALIZED
title: Shared dependency criticality determines the strength of correlated proof clusters
scope: Verification reverse-analysis; concerns distinguishing incidental shared dependencies from dependencies whose failure can invalidate an entire cluster of proof artifacts.
statement: Not every shared dependency creates the same epistemic risk; a shared dependency is critical to a proof cluster when failure of that dependency can simultaneously invalidate the validity or interpretation of multiple proofs in the cluster.
