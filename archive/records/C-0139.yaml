id: C-0139
type: claim
status: FORMALIZED
title: Epistemic integrity requires detecting forbidden justification paths, not merely graph cycles
scope: Research Library provenance and verification history; concerns circular justification, self-support paths, and typed epistemic dependency graphs.
statement: A cycle is not by itself an epistemic violation. Integrity analysis must identify paths in which a claim, directly or transitively, contributes to generating, selecting, validating, or otherwise supporting evidence that is then used to justify the same claim. Such forbidden justification paths constitute circular self-support even when the graph contains legitimate feedback cycles elsewhere.
