engineering:
  consequence: "A verification-depth decision should record the claim scope, relevant risk coverage, remaining uncertainty, stopping rationale, and any excluded verification domains. Global depth limits may constrain resources but should not by themselves establish adequacy."
  gap: "Formal stopping predicate, residual-risk representation, diminishing-return criterion, resource-bound interaction, and audit requirements for stopping decisions have not yet been defined."
