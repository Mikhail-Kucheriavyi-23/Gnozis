id: C-0104
type: claim
status: FORMALIZED
title: Verification-depth stopping requires a claim-scoped adequacy criterion
scope: Research Library provenance and verification history; concerns stopping criteria for recursive verification of evidence independence and analysis adequacy.
statement: Recursive verification of independence and analysis adequacy requires a stopping criterion defined relative to the claim, scope, relevant failure modes, and residual uncertainty; stopping cannot be justified solely by a fixed global depth or by the absence of further detected dependencies.
