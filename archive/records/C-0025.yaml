title: Hidden shared assumptions create correlation between apparently separate proofs
scope: Verification reverse-analysis; concerns dependence between proof artifacts that appear distinct but rely on an untracked common assumption, dependency, oracle, model, or transformation.
statement: Proof artifacts can be formally separate yet epistemically correlated when they depend on the same unverified assumption, dependency, oracle, model, transformation, or semantic interpretation; their agreement therefore does not provide independent confirmation of the shared dependency.
