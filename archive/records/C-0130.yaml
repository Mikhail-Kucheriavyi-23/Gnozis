engineering:
  consequence: "Adaptive verification allocation should retain explicit exploration/diversification or minimum coverage constraints and expose selection logic, low-yield classes, and untested regions. Search yield must not be treated as a proxy for verification adequacy."
  gap: "Formal coverage constraints, allocation objective, exploration/exploitation balance, rare-failure protection, adversarial scheduling, and audit semantics for allocation decisions have not yet been defined."
