id: C-0130
type: claim
status: FORMALIZED
title: Verification budget optimization can introduce selection bias and must preserve coverage against low-yield failure classes
scope: Research Library provenance and verification history; concerns adaptive allocation of finite verification resources and systematic under-sampling of difficult or rare failure classes.
statement: An optimizer that allocates verification resources according to observed test yield, ease of discovery, or current model estimates can systematically under-sample rare, latent, adversarial, or low-yield failure classes. Budget allocation therefore requires explicit coverage constraints or diversification mechanisms so optimization of search yield does not become a substitute for coverage.
