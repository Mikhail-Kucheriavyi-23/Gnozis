id: C-0021
type: claim
status: FORMALIZED
title: Absence of observed counterexamples does not establish semantic completeness
scope: Verification reverse-analysis; concerns claims that a verification observation set is complete because known counterexamples have not been found.
statement: Failure to find counterexamples within a tested observation and search domain does not by itself establish that the observation set captures all semantically relevant distinctions or that no unobserved semantic failure exists outside that domain.
