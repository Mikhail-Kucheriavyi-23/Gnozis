engineering:
  consequence: "Verification reports must state the tested search domain and observation boundary. 'No counterexample found' must not be promoted to semantic completeness without an explicit completeness argument, bounded exhaustive proof, or other justified coverage criterion."
  gap: "A formal completeness criterion for the relevant Gnozis semantic domain and counterexample search space has not yet been defined."
