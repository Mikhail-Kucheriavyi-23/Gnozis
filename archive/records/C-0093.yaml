engineering:
  consequence: "Verification aggregation should define required properties, coverage criteria, treatment of UNKNOWN and UNVERIFIED results, and explicit rules for producing aggregate statuses. The aggregate result should retain its scope and provenance to underlying checks."
  gap: "Formal aggregate-status lattice, required-property semantics, unknown propagation rules, and aggregation operators have not yet been defined."
