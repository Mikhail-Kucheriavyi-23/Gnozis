id: C-0093
type: claim
status: FORMALIZED
title: Aggregate verification status is a derived claim over scoped property-level results
scope: Research Library provenance and verification history; concerns aggregation of property-level verification results into a higher-level status.
statement: An aggregate verification status over a claim, failure mode, or artifact is a derived claim over scoped property-level verification results and requires an explicit aggregation rule; local PASS results must not be treated as global VERIFIED without establishing that all required properties and conditions for the declared scope are covered.
