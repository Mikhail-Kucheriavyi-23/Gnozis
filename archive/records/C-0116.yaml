id: C-0116
type: claim
status: FORMALIZED
title: Model disagreement must be distinguished from direct claim conflict
scope: Research Library provenance and verification history; concerns differing dependency/impact models used by multiple agents.
statement: When agents derive different containment or impact conclusions from different dependency models, the disagreement must first be represented as a model-level disagreement; it must not be classified as a direct contradiction in the underlying claim unless the agents share sufficiently equivalent assumptions, scope, and semantics and still derive incompatible claim states.
