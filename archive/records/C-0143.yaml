id: C-0143
type: claim
status: FORMALIZED
title: Search-space models require their own challenge process to bound model blind spots
scope: Research Library provenance and verification history; concerns search-space model adequacy, model challenge, systematic blind spots, and meta-adequacy.
statement: Coverage and verification results conditional on a search-space model cannot establish adequacy of that model by themselves. The model requires an independent or adversarial challenge process capable of exposing omitted, misclassified, or systematically inaccessible regions. Model adequacy is therefore a distinct verification target from claim verification within the model.
