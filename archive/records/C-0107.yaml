id: C-0107
type: claim
status: FORMALIZED
title: Epistemic-status changes require explicit evidence and provenance transitions
scope: Research Library provenance and verification history; concerns integrity of epistemic state transitions and separation from governance events.
statement: Any change in the epistemic status of a claim must be represented as an explicit state transition with attributable evidence, provenance, transition rationale, and applicable verification criteria; governance events alone cannot implicitly upgrade or downgrade epistemic status.
