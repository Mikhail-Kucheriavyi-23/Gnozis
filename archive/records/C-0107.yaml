engineering:
  consequence: "Epistemic transitions should be append-only, attributable, and separately auditable. A transition such as UNKNOWN -> VERIFIED requires explicit supporting evidence and satisfaction of the verification predicate; governance actions must be recorded as distinct events."
  gap: "Formal epistemic state machine, transition predicates, provenance requirements, downgrade/revocation semantics, and cross-links between governance and epistemic events have not yet been defined."
