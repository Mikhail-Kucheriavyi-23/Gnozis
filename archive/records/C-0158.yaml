id: C-0158
type: claim
status: FORMALIZED
title: Independent authorization of component actions does not imply authorization of their composition when composition changes material effect
scope: Research Library provenance and verification history; concerns compositional authorization, action decomposition, policy circumvention, and aggregate external effect.
statement: Authorization of individual actions does not by itself authorize their composition when the combined execution can produce a materially different effect, risk, or state transition. Authorization analysis must therefore account for relevant compositions, dependencies, ordering, shared resources, and aggregate effects rather than evaluating only isolated atomic actions.
