id: C-0154
type: claim
status: FORMALIZED
title: A verification pass does not by itself authorize commit when materially relevant challenge paths remain unresolved
scope: Research Library provenance and verification history; concerns verification pass semantics, stopping, unresolved evidence, and execution authorization.
statement: A positive verification result establishes only the scope represented by that result. If materially relevant evidence or challenge paths remain unresolved because of stopping, unavailable resources, excluded tests, model uncertainty, or control-policy effects, commit authorization requires an additional condition addressing that residual state. Verification pass and commit eligibility are distinct claims.
