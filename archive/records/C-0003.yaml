title: Structural evolution is not equivalent to semantic growth
scope: Mathematical reverse-analysis of evolving systems; distinguishes changes in structure, state space, or representation from demonstrated improvement of the system's intended semantics.
statement: An evolution step that increases, changes, or reorganizes structural state does not by itself establish semantic growth, improvement, or preservation of the intended system property.
