id: C-0067
type: claim
status: FORMALIZED
title: Normalization applicability decisions must remain distinct from their supporting inputs
scope: Research Library provenance and verification history; concerns epistemic separation between context facts, applicability criteria, and the resulting authorization decision.
statement: A normalization applicability decision is a derived result and must remain distinct from the facts, semantic context, invariance contract, and criteria that support it; storing an accepted decision does not constitute evidence for the decision itself.
