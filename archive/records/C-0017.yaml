id: C-0017
type: claim
status: FORMALIZED
title: Observational equivalence can hide semantic distinctions
scope: Verification reverse-analysis; concerns equivalence induced by a restricted observation mechanism.
statement: If an oracle or observation function maps distinct system states to the same observable result, those states are observationally equivalent under that oracle even though they may remain semantically distinct; verification based only on that oracle cannot distinguish the hidden semantic difference.
