title: Current epistemic state must be reconstructible as a deterministic projection of immutable history
scope: Research Library provenance and verification history; concerns current-state derivation from append-only epistemic events.
statement: The current epistemic state of a claim should be derivable from its immutable ordered history through an explicit deterministic projection function; current-state storage may be an optimization but must not become the sole source of epistemic truth or permit silent divergence from the recorded event history.
