id: C-0037
type: claim
status: FORMALIZED
title: Scope or assumption changes require re-evaluation of dependent claims
scope: Research Library provenance and verification history; concerns claims whose semantic text is unchanged while their declared scope or assumptions change.
statement: A change to the scope, assumptions, prerequisites, or interpretation boundary of a claim or its supporting proof can alter the conditions under which the claim is valid; dependent claims and evidence must therefore be re-evaluated even when the claim text itself remains unchanged.
