id: C-0138
type: claim
status: FORMALIZED
title: Cycle validity depends on node roles as well as edge types and claim scope
scope: Research Library provenance and verification history; concerns epistemic dependency graphs, typed node roles, typed relations, and circular justification.
statement: Determining whether a dependency cycle is epistemically admissible requires the roles of source and target nodes in addition to edge type and claim scope. The same relation type can have different consequences when connecting evidence, claims, models, transformations, validators, or decisions. Therefore cycle analysis must operate on typed node-role and edge-role semantics rather than graph topology alone.
