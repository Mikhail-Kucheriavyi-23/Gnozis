id: C-0184
type: claim
status: FORMALIZED
title: Adaptive verification provenance must track information availability at evidence-generation time to detect temporal leakage
scope: Research Library provenance and verification history; concerns adaptive verification, temporal provenance, information availability, future leakage, evidence generation, and evaluation integrity.
statement: In adaptive verification, evidence validity depends not only on the observed result and evaluation criterion but also on what information was available when the evidence was generated. If future observations, revised criteria, or later system states influence the construction or selection of earlier evidence without explicit designation, the resulting claim may suffer temporal leakage and lose the intended evidentiary independence.
