id: C-0112
type: claim
status: FORMALIZED
title: Replay order must not erase causal concurrency
scope: Research Library provenance and verification history; concerns preservation of concurrent epistemic events during deterministic replay.
statement: A deterministic total order used for replay or projection must not be treated as evidence of causal precedence when events are concurrent; causal relations and replay tie-breaking must remain distinguishable, and any conflict-resolution rule for concurrent events must be explicit.
