id: C-0022
type: claim
status: FORMALIZED
title: Bounded exhaustive verification can establish a scoped property when the domain is finite and exhaustively covered
scope: Verification reverse-analysis; concerns the conditions under which exhaustive checking over a finite, explicitly defined domain supports a complete claim for that domain.
statement: If a verification domain is finite or otherwise exhaustively enumerable, its boundaries are explicit, the checking procedure is sound for the property, and every element of the declared domain is actually checked, absence of a counterexample can establish the property for that bounded domain; this does not automatically extend the result beyond the declared domain.
