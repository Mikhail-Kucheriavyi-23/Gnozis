id: C-0173
type: claim
status: FORMALIZED
title: Observational equivalence under a verification regime can require a new observation regime rather than additional samples
scope: Research Library provenance and verification history; concerns hypothesis identifiability, observational equivalence, observation expressiveness, sampling, and verification regime design.
statement: When admissible hypotheses remain observationally equivalent under the current observation regime, increasing sample count within that same regime does not guarantee further identification. The verification process must distinguish insufficient sampling from insufficient observational expressiveness and may require a new observation regime capable of exposing previously invisible differences.
