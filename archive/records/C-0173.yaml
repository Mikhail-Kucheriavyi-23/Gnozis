engineering:
  consequence: "Track the observation regime used by each verification result and distinguish sample insufficiency from regime insufficiency. Permit research-level proposals for new observation mechanisms when unresolved hypotheses remain equivalent under the current regime."
  gap: "Formal observation-regime model, identifiability criterion, regime-change trigger, and method for validating that a new regime adds independent observational expressiveness have not yet been defined."
