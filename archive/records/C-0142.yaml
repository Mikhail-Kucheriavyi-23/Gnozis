id: C-0142
type: claim
status: FORMALIZED
title: Coverage claims are conditional on the declared search-space model
scope: Research Library provenance and verification history; concerns modeled search spaces, coverage claims, model incompleteness, and unknown regions.
statement: A coverage claim establishes coverage only relative to the declared model of the relevant evidence or test space. If the model is incomplete, mis-specified, or excludes relevant regions, high modeled coverage does not establish equivalent coverage of the underlying real search space. Coverage claims must therefore identify the search-space model and its scope.
