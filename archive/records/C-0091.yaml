id: C-0091
type: claim
status: FORMALIZED
title: Verification coverage transfer across failure-model lineage requires an explicit relation-specific rule
scope: Research Library provenance and verification history; concerns transfer of historical verification coverage to evolved failure-mode representations.
statement: Verification coverage established for a predecessor failure mode must not be transferred automatically to a successor representation; any transfer requires a relation-specific rule and evidence that the properties relevant to the verification objective are preserved within the declared scope.
