id: C-0150
type: claim
status: FORMALIZED
title: Bottleneck detection is itself a verification dependency when it controls challenge selection
scope: Research Library provenance and verification history; concerns bottleneck detection, adaptive challenge selection, selection bias, and meta-verification.
statement: When an automated bottleneck detector determines which epistemic challenge is selected next, the detector becomes part of the verification dependency graph. Its classification can systematically bias challenge allocation toward dimensions that are easier to improve or observe while leaving high-impact but difficult uncertainties under-tested. Bottleneck detection therefore requires provenance, challengeability, and bias analysis.
