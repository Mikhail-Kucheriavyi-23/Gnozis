id: C-0162
type: claim
status: FORMALIZED
title: Adversarial sampling can create blind spots by overconcentrating challenge generation on selected failure regions
scope: Research Library provenance and verification history; concerns adversarial sampling bias, alternative failure regions, sampling blind spots, and diversity of challenge generators.
statement: A deliberately adversarial sampling policy can improve discovery in a targeted region while simultaneously reducing effective exploration of alternative failure regions. Therefore tail-focused or failure-directed sampling requires explicit diversity and alternative-region checks; success in one adversarial region does not establish adequate exploration of other regions.
