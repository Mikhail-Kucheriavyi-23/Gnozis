id: C-0172
type: claim
status: FORMALIZED
title: Pairwise hypothesis discrimination does not establish global separation when alternative hypotheses remain observationally unresolved
scope: Research Library provenance and verification history; concerns competing hypotheses, discriminating tests, pairwise discrimination, global hypothesis separation, and residual alternatives.
statement: A test designed to distinguish one pair of hypotheses can leave other admissible hypotheses observationally unresolved. Therefore pairwise discrimination must not be interpreted as global hypothesis separation unless the relevant alternative hypothesis space has also been addressed or explicitly bounded.
