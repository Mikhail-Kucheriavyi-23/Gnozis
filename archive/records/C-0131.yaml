title: Mandatory verification coverage must constrain adaptive allocation independently of observed search yield
scope: Research Library provenance and verification history; concerns protected verification coverage classes and separation of search optimization from adequacy invariants.
statement: Adaptive verification allocation must be constrained by an explicit set of mandatory coverage requirements derived from claim scope, relevant failure classes, invariants, and authority/policy boundaries. These requirements must not be removable solely because observed yield is low, uncertain, or inconvenient for the allocator.
