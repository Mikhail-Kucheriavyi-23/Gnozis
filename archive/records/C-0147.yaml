engineering:
  consequence: "Represent reachability expansion and completeness as separate claims. Preserve residual-uncertainty records even when alternative generators find regions outside the current model, and never infer absence of blind spots solely from failure to discover an escape."
  gap: "Formal reachable-space representation, residual-uncertainty model, completeness claim semantics, and criteria for material reachability expansion have not yet been defined."
