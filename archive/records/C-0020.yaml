title: Combined observables can increase discrimination without establishing complete semantic coverage
scope: Verification reverse-analysis; concerns combining multiple observation functions to refine distinguishability of system states.
statement: Combining multiple observables can refine observational equivalence classes and distinguish states that a single observable cannot distinguish, but the resulting joint observation remains only as complete as the semantic dimensions it actually captures.
