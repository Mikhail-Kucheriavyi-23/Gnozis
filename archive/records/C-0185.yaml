id: C-0185
type: claim
status: FORMALIZED
title: Evidence count does not equal independent support count when evidence shares dependencies, assumptions, channels, adaptive ancestry, or failure modes
scope: Research Library provenance and verification history; concerns evidence dependence, independence, common causes, correlated observations, shared assumptions, adaptive ancestry, and verification strength.
statement: Individually valid evidence items do not necessarily constitute independent supports for a claim. Evidence can share observation channels, assumptions, data sources, causal mechanisms, adaptive selection history, or failure modes. Verification strength therefore depends on evidence dependency structure and diversity, not merely on the number of passing observations.
