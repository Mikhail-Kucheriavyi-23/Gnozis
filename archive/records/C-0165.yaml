id: C-0165
type: claim
status: FORMALIZED
title: Adaptive verification after a new failure must preserve alternative unresolved regions to prevent attention-induced blind spots
scope: Research Library provenance and verification history; concerns adaptive verification, attention allocation, reprioritization, unresolved regions, and verification blind spots.
statement: Discovering a new failure mode can legitimately reprioritize verification toward the newly exposed region, but adaptive verification must retain explicit representation of alternative unresolved regions. Reprioritization must not silently convert untested or weakly tested regions into resolved status. Verification strategy changes require provenance and residual-coverage reporting.
