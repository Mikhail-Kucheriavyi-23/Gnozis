id: C-0101
type: claim
status: FORMALIZED
title: Evidence diversity must account for shared dependency ancestors and correlated failure modes
scope: Research Library provenance and verification history; concerns dependency-graph effects on effective independence of evidence.
statement: When multiple evidence paths share dependency ancestors, their observations may be correlated through common failure mechanisms even when no direct dependency exists between the final tests; assessment of evidence diversity must therefore account for shared ancestors and relevant common-mode failure paths in the dependency graph.
