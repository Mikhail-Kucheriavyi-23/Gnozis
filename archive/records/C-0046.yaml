title: Acyclic provenance does not establish evidence independence
scope: Research Library provenance and verification history; concerns apparently separate evidence paths that converge on shared upstream sources, oracles, assumptions, transformations, or infrastructure.
statement: An acyclic support or dependency graph does not by itself establish independence between evidence paths; two or more paths may remain correlated through a shared upstream source, oracle, assumption, transformation, dataset, implementation, or trust boundary.
