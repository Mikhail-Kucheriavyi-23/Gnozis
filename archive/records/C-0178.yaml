id: C-0178
type: claim
status: FORMALIZED
title: Evolution should trigger claim-scoped evidence impact analysis rather than indiscriminate historical evidence reset
scope: Research Library provenance and verification history; concerns evolutionary change, evidence impact analysis, selective revalidation, knowledge continuity, claim dependencies, and evidence invalidation.
statement: A change in system state does not by itself invalidate all historical evidence. Evidence applicability after evolution should be assessed per claim using the dependencies and conditions relevant to that claim. The resulting impact analysis should classify historical evidence as still applicable, conditionally applicable, requiring revalidation, invalidated, or applicability unknown.
