engineering:
  consequence: "Applicability evaluation should bind verification records to claim version/state, criterion version, dependency state, assumptions, scope, and relevant temporal/provenance context. A latest-record shortcut must not override these bindings."
  gap: "Formal claim-version/state schema and machine-checkable applicability rules have not yet been defined for the Research Library."
