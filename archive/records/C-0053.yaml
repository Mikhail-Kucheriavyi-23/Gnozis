id: C-0053
type: claim
status: FORMALIZED
title: Current applicability is time- and state-relative, not determined by the latest verification record alone
scope: Research Library provenance and verification history; concerns evaluating whether a historical verification result applies to a current claim and criterion.
statement: Current applicability of a verification result must be evaluated against the criterion version and the relevant claim state at the applicable time; the latest verification record alone is insufficient because later claim changes, dependency changes, scope changes, assumption changes, or criterion transitions may affect applicability.
