id: C-0149
type: claim
status: FORMALIZED
title: Epistemic progress should target limiting dimensions rather than maximize undirected information gain
scope: Research Library provenance and verification history; concerns multidimensional verification state, epistemic bottlenecks, challenge selection, and targeted uncertainty reduction.
statement: When verification status is multidimensional, selection of the next challenge should account for the current epistemic bottleneck or limiting dimension rather than maximizing undirected information gain alone. A challenge that materially reduces uncertainty in the dimension constraining the current claim can provide greater epistemic progress than one producing more information in an already well-supported dimension.
