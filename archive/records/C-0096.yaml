id: C-0096
type: claim
status: FORMALIZED
title: Conflict resolution must establish comparability before applying a resolution rule
scope: Research Library provenance and verification history; concerns interpretation and resolution of conflicting verification results.
statement: A conflict-resolution procedure must first establish that the conflicting results concern the same claim semantics, relevant scope, conditions, and comparable verification context; only then may a scoped resolution rule determine their aggregate effect. PASS/FAIL precedence alone is insufficient.
