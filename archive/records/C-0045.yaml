id: C-0045
type: claim
status: FORMALIZED
title: Provenance cycle detection must distinguish invalid support cycles from valid reference graphs
scope: Research Library provenance and verification history; concerns graph cycles created by references, derivations, dependencies, or mutual contextual links.
statement: The existence of a graph cycle is not by itself evidence of invalidity; cycle detection must distinguish cycles in epistemic support or dependency justification from cycles that arise only from non-supporting references, metadata links, or other relations that do not establish evidentiary dependence.
