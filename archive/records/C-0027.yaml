id: C-0027
type: claim
status: FORMALIZED
title: Dependency failure must propagate to affected proof and claim validity
scope: Verification reverse-analysis; concerns traceable invalidation of proof artifacts and claims when a dependency or assumption they require is shown to fail.
statement: When a proof artifact or claim depends on a prerequisite whose validity is disproved or materially invalidated, the archive must be able to identify the affected artifacts and downgrade or invalidate only those results whose validity actually depends on that prerequisite.
