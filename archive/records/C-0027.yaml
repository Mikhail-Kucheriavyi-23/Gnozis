engineering:
  consequence: "Research Library provenance must support dependency-failure propagation and selective invalidation. A failed prerequisite must not silently leave dependent claims marked valid, while unrelated claims must not be invalidated merely because they coexist in the same cluster."
  gap: "A formal invalidation/downgrade state machine and dependency-propagation algorithm have not yet been defined for Gnozis."
