title: Common-mode model fit to observed correlations does not establish adequacy of the model
scope: Research Library provenance and verification history; concerns adequacy of dependency/correlation models used to bound independence claims.
statement: A dependency or common-mode model that explains observed correlations is not thereby established as adequate for independence assessment; adequacy requires separate challenge of omitted dependencies, latent shared factors, scope assumptions, and failure classes not represented by the observed data.
