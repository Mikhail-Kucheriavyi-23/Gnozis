id: C-0055
type: claim
status: FORMALIZED
title: Claim state requires immutable content identity
scope: Research Library provenance and verification history; concerns distinguishing exact claim content/state versions despite stable logical claim identity.
statement: Each immutable claim state must have a content identity derived from its canonical semantic content and relevant verification-bound metadata; a stable logical claim identifier alone must not be sufficient to identify the exact proposition that was verified.
