id: C-0076
type: claim
status: FORMALIZED
title: Changes in compatibility classification require attribution to projection, context, inputs, or compatibility specification
scope: Research Library provenance and verification history; concerns causal attribution of changed semantic compatibility results across evaluations.
statement: When compatibility classification changes across evaluations, provenance must distinguish whether the change arose from semantic projection changes, normalized inputs, context changes, compatibility-specification changes, or other declared evaluation inputs; otherwise the archive cannot attribute the source of the classification transition.
