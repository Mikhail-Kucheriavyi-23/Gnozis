id: C-0180
type: claim
status: FORMALIZED
title: Evolution can affect verification infrastructure validity, requiring versioned validator scope and impact analysis
scope: Research Library provenance and verification history; concerns validator evolution, verification infrastructure, temporal validity, validator scope, and recursive trust dependencies.
statement: System evolution can alter assumptions, dependencies, observation conditions, or invariants on which verification infrastructure itself relies. Therefore a validator or verification procedure at time t cannot automatically be treated as valid for later system states. Validator scope, dependencies, and applicability should be versioned and subject to impact analysis when relevant system changes occur.
