id: C-0122
type: claim
status: FORMALIZED
title: Model adequacy requires a bounded stopping condition rather than an absolute proof of no blind spots
scope: Research Library provenance and verification history; concerns stopping criteria for recursive adequacy and common-mode challenge.
statement: Verification of model adequacy cannot generally establish the absence of every possible blind spot; acceptance therefore requires an explicit bounded stopping condition tied to claim scope, relevant failure classes, challenge coverage, residual uncertainty, and permitted risk, with unresolved out-of-scope uncertainty retained rather than converted into certainty.
