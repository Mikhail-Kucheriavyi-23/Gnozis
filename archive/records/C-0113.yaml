id: C-0113
type: claim
status: FORMALIZED
title: Conflict resolution for concurrent epistemic transitions is part of transition semantics
scope: Research Library provenance and verification history; concerns explicit, versioned, auditable resolution of non-commutative concurrent epistemic events.
statement: When concurrent epistemic transitions are non-commutative or otherwise incompatible, the rule used to resolve their interaction is part of the transition semantics and must be explicit, versioned, and auditable; deterministic replay tie-breaking alone cannot constitute epistemic justification for selecting one outcome over another.
