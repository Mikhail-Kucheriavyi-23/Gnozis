id: C-0006
type: claim
status: FORMALIZED
title: Verification procedures require meta-verification
scope: Verification reverse-analysis; concerns the possibility that a verification method can systematically miss its own failure modes or blind spots.
statement: A verification procedure cannot establish its own adequacy solely by producing successful results under that same procedure; the verification process itself requires independent or structurally distinct checks for blind spots, failure modes, and adequacy assumptions.
