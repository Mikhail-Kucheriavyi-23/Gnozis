id: C-0052
type: claim
status: FORMALIZED
title: Criterion change preserves historical result while potentially changing current applicability
scope: Research Library provenance and verification history; concerns the distinction between validity of a historical verification result under its original criterion and applicability of that result under a newer criterion.
statement: A change to a verification criterion does not by itself invalidate the historical verification result obtained under the prior criterion; the prior result remains attributable to its original criterion version, while current applicability under the new criterion must be evaluated explicitly.
