title: Normalization applicability context must be provenance-bound
scope: Research Library provenance and verification history; concerns reproducibility of context-dependent normalization decisions.
statement: When normalization invariance depends on context, the context used to authorize the transformation must be captured as provenance-bound input; otherwise the archive cannot reproduce or audit why the transformation was admissible for the specific claim state.
