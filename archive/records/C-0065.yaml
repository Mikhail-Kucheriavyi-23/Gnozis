engineering:
  consequence: "Normalization invariance contracts should bind each rule to projection version, semantic domain, and applicability conditions. A rule proven invariant in one context must not be generalized automatically to other projections or contexts."
  gap: "Formal context binding, invariance proof obligations, and applicability evaluation for normalization rules have not yet been defined for the Research Library."
