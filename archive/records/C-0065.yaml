id: C-0065
type: claim
status: FORMALIZED
title: Normalization invariance must be established relative to the semantic projection and applicable context
scope: Research Library provenance and verification history; concerns whether a normalization rule preserves the meaning represented by a specific claim projection under its declared context.
statement: A normalization rule's semantic invariance is meaningful only relative to a specified semantic projection and applicability context; generic claims that a transformation is safe are insufficient because the same transformation may preserve meaning for one projection or context and alter it for another.
