id: C-0105
type: claim
status: FORMALIZED
title: Residual uncertainty must not be silently reclassified as accepted residual risk
scope: Research Library provenance and verification history; concerns stopping decisions under incomplete dependency knowledge.
statement: Verification stopping must distinguish residual uncertainty about unknown or unobserved failure/dependency conditions from explicitly accepted residual risk; an unknown dependency or unverified condition cannot be treated as acceptable residual risk merely because analysis stopped or resources were exhausted.
