id: C-0033
type: claim
status: FORMALIZED
title: Authorization scope must be canonical and unambiguous
scope: Research Library provenance and verification history; concerns whether a scoped authorization can be reliably matched to the intended object or claim without ambiguity.
statement: A scoped authorization is only enforceable when its target scope has a canonical, stable, and unambiguous identity; ambiguous, mutable, or overlapping scope representations can permit unintended authority expansion or make transition validation indeterminate.
