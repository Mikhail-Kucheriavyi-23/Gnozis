id: C-0167
type: claim
status: FORMALIZED
title: Verification budget policy is itself part of the verification system and can create systematic blind spots
scope: Research Library provenance and verification history; concerns verification-budget allocation, sampling distributions, policy-induced blind spots, observability, and meta-verification.
statement: The policy that allocates verification budget influences which regions receive evidence and therefore forms part of the effective verification system. Because that policy can systematically under-sample or exclude regions, its assumptions and allocation decisions require observability and meta-verification rather than being treated as an external neutral mechanism.
