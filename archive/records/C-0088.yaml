id: C-0088
type: claim
status: FORMALIZED
title: New failure discoveries require relation classification before failure-model evolution
scope: Research Library provenance and verification history; concerns classification of newly discovered failure modes and avoidance of artificial model inflation.
statement: A newly observed failure candidate must be related to the existing failure model before being added as a distinct failure mode; the relation may be an extension, refinement, duplicate, correction, or conflict, and this classification must be preserved as provenance for subsequent model evolution.
