engineering:
  consequence: "Failure-model evolution should classify each discovered candidate against existing modes before creating a new node. The relation classification and its basis should remain auditable and should determine whether the model is extended, refined, deduplicated, corrected, or placed in conflict."
  gap: "Formal relation taxonomy, equivalence/refinement criteria, deduplication rules, conflict semantics, and provenance schema for failure-mode discovery have not yet been defined."
