title: Proof continuity does not imply semantic continuity
scope: Mathematical reverse-analysis of evolving formal models; applies only where proof obligations and semantic interpretation are explicitly distinguished.
statement: Preservation or continuity of a proof-level property across a model transition does not, by itself, establish preservation or continuity of the model's full semantics.
