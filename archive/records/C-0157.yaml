id: C-0157
type: claim
status: FORMALIZED
title: Conflict resolution requires explicit conflict type, materiality, authority boundary, and action context
scope: Research Library provenance and verification history; concerns conflict resolution between verification and authorization, authority boundaries, materiality, and action-specific policy.
statement: Resolution of a conflict between verification status and authorization policy should not impose an unconditional precedence of either side. Resolution should depend on the identified conflict type, materiality of the unresolved state, applicable authority boundary, and the action being requested. Resolution outcomes must preserve the independent provenance of verification and authorization states.
