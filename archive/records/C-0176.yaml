id: C-0176
type: claim
status: FORMALIZED
title: Interventional discrimination does not by itself justify transport of post-intervention evidence to baseline or other system states
scope: Research Library provenance and verification history; concerns interventional evidence, transportability, invariance, baseline inference, state dependence, and evidence scope.
statement: Evidence that distinguishes hypotheses under an intervention establishes a claim about the intervention-conditioned system unless additional assumptions justify transport. Applying that evidence to an unperturbed baseline or another system state requires explicit invariance, transportability, or equivalence conditions; absent such justification, the broader inference must retain residual uncertainty.
