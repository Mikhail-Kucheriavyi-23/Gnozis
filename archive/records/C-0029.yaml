id: C-0029
type: claim
status: FORMALIZED
title: Current evidence status should be derived from an authorized transition history
scope: Research Library provenance and verification history; concerns the integrity of current evidence status and prevention of arbitrary status mutation.
statement: The current validity state of an evidence or claim record should be derivable from an ordered sequence of authorized state transitions; an unconstrained mutable status field cannot by itself provide sufficient provenance or integrity.
