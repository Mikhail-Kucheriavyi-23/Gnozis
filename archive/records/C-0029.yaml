engineering:
  consequence: "Archive records should derive current status from an append-only, authorized transition log or equivalent immutable history. Transition legality, actor authority, predecessor state, reason, and provenance should be machine-checkable."
  gap: "A complete transition state machine, authorization model, and canonical derivation procedure for evidence status have not yet been defined for the Research Library."
