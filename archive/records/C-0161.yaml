id: C-0161
type: claim
status: FORMALIZED
title: Verification sampling may intentionally differ from world distribution, but sampled frequencies cannot be interpreted as world frequencies without separate inference
scope: Research Library provenance and verification history; concerns adversarial sampling, tail oversampling, sampling intent, evidence interpretation, and distinction between verification and world distributions.
statement: Verification sampling can be intentionally non-representative, including tail-focused, adversarial, stress, or counterexample-oriented sampling. Such sampling can improve failure discovery but changes the relationship between observed sample frequencies and real-world frequencies. Sampling intent and selection mechanism must therefore be preserved, and verification observations must not be interpreted as estimates of world frequency without an explicit inference model and assumptions.
