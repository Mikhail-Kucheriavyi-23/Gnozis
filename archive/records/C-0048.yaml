id: C-0048
type: claim
status: FORMALIZED
title: Dependency impact classification must be derived from propagation to the supported claim
scope: Research Library provenance and verification history; concerns whether a shared dependency is critical, material, or peripheral to a specific claim.
statement: The impact class of a shared dependency must be determined relative to a target claim by analyzing whether failure of that dependency propagates to loss, material weakening, or no material change in the claim's evidentiary support; the class must not be assigned solely by metadata or subjective labeling.
