id: C-0085
type: claim
status: FORMALIZED
title: Relevant independence dimensions must be justified by the verification claim
scope: Research Library provenance and verification history; concerns design and auditability of independence requirements in verification.
statement: The selection of independence dimensions required for a verification claim must be explicitly justified from the claim's verification objective and failure model; otherwise a formally valid independence assessment may remain inadequate because it evaluates an irrelevant or incomplete dimension.
