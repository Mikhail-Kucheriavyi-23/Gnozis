id: C-0019
type: claim
status: FORMALIZED
title: A new observable is useful only if it increases semantic discrimination
scope: Verification reverse-analysis; concerns whether adding an observation channel actually resolves an existing semantic blind spot.
statement: Adding a technically distinct observable does not by itself remove an observability blind spot; the new observable must distinguish at least some semantically relevant states that were previously indistinguishable under the existing observation boundary.
