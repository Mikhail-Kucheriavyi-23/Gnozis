id: C-0124
type: claim
status: FORMALIZED
title: Epistemic revision requires operational reassessment without rewriting historical acceptance decisions
scope: Research Library provenance and verification history; concerns lifecycle of operational permissions after changes to epistemic state.
statement: When the epistemic status, evidence scope, residual uncertainty, or relevant model changes materially, affected operational acceptances should be re-evaluated under the current policy; prior acceptance decisions remain historical records bound to their original epistemic state, policy version, scope, and authority and must not be rewritten as if they reflected later knowledge.
