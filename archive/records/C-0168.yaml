id: C-0168
type: claim
status: FORMALIZED
title: Meta-verification of a policy that controls evidence selection requires explicit non-circular validation boundaries
scope: Research Library provenance and verification history; concerns self-reference, circular evidence, policy-controlled sampling, meta-verification boundaries, and independent validation.
statement: When a verification or budget policy controls the selection of evidence used to assess that same policy, the assessment can become circular. Trust in the policy must therefore not rely exclusively on evidence selected by the policy itself. A non-circular validation boundary requires explicit external, structurally independent, frozen, or otherwise separately justified evidence sources and assumptions.
