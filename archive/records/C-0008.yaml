id: C-0008
type: claim
status: FORMALIZED
title: Verification mechanism diversity must be distinguished from test multiplicity
scope: Verification reverse-analysis; concerns whether multiple checks provide genuinely different failure detection or merely repeat the same assumptions through different implementations.
statement: Multiple verification mechanisms are not necessarily independent merely because they are implemented as different tests, tools, or procedures; effective diversity depends on differences in assumptions, failure modes, observation channels, or proof structure.
