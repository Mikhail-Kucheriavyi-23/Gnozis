id: C-0092
type: claim
status: FORMALIZED
title: Verification coverage transfer must be partial and scope-bound
scope: Research Library provenance and verification history; concerns transfer of historical verification results across evolved failure modes.
statement: When coverage transfer across failure-model lineage is admissible, the transferred result applies only to explicitly preserved properties and failure conditions within the declared verification scope; an overall VERIFIED status must not be inherited by a successor whose additional or changed properties remain unverified or unknown.
