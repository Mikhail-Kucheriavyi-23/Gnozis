title: Re-evaluation requires a recorded outcome and fresh provenance
scope: Research Library provenance and verification history; concerns the evidence and state transition produced after a dependent claim is re-evaluated.
statement: Marking a claim or proof as requiring re-evaluation is not itself a verification result; the archive must record the outcome of the re-evaluation, the evidence and assumptions used, the responsible authority, and the resulting state transition.
