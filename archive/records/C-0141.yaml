id: C-0141
type: claim
status: FORMALIZED
title: Verification must distinguish observed, unavailable, and excluded evidence-space regions
scope: Research Library provenance and verification history; concerns search-space accounting, selection provenance, excluded tests/evidence, and adequacy interpretation.
statement: A verification process must distinguish evidence that was observed, evidence that was unavailable to the process, and evidence or tests that were available but excluded by selection or policy. These states have different epistemic meanings and must not be collapsed into a single unobserved category when assessing coverage or adequacy.
