id: C-0144
type: claim
status: FORMALIZED
title: Model-challenge stopping requires residual-uncertainty accounting rather than challenge-count thresholds alone
scope: Research Library provenance and verification history; concerns stopping rules, residual uncertainty, untested model alternatives, and diminishing information gain.
statement: Stopping a search-space model challenge cannot be justified solely by the number of challenges performed or achieved modeled coverage. A stopping decision must account for residual uncertainty, relevant untested alternatives, remaining blind-spot hypotheses, and the materiality of possible omitted regions. Diminishing marginal information gain may inform stopping but does not by itself establish adequacy.
