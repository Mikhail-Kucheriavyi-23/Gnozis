engineering:
  consequence: "Lifecycle edges should use typed relations. REEVALUATES denotes a new evaluation under changed/current inputs; CORRECTS denotes repair of a defective predecessor; INVALIDATES denotes loss of validity under an identified condition; SUPERSEDES denotes replacement for an operational/current use without implying that the predecessor was historically incorrect."
  gap: "Formal relation semantics, allowed source/target states, composition rules, and validation constraints for decision lineage relations have not yet been defined for the Research Library."
