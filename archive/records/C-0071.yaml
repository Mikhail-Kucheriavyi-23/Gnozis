id: C-0071
type: claim
status: FORMALIZED
title: Decision lineage relations must distinguish reevaluation, correction, invalidation, and supersession
scope: Research Library provenance and verification history; concerns semantic meaning of relationships between applicability decisions across lifecycle transitions.
statement: Decision lineage must distinguish at minimum REEVALUATES, CORRECTS, INVALIDATES, and SUPERSEDES because these relations encode different causes and epistemic effects; they must not be collapsed into a generic successor relation.
