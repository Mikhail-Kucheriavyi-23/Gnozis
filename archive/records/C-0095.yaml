id: C-0095
type: claim
status: FORMALIZED
title: Aggregate verification must preserve unresolved conflicts rather than collapse them into false certainty
scope: Research Library provenance and verification history; concerns conflicting local verification results and aggregate status computation.
statement: Conflicting verification results must remain explicitly represented as a conflict or unresolved state until an authorized, scoped conflict-resolution procedure determines their relation and effect; aggregation must not collapse disagreement into VERIFIED or FAIL merely to produce a single status.
