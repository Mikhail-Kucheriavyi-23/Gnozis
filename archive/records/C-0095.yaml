engineering:
  consequence: "Verification aggregation should expose conflict as an explicit state or relation and preserve the conflicting results, scopes, provenance, and resolution status. Conflict resolution must be deterministic or explicitly governed and auditable."
  gap: "Formal conflict-state semantics, resolution authority, precedence rules, reconciliation procedure, and aggregation behavior under unresolved conflict have not yet been defined."
