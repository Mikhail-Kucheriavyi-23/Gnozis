id: C-0099
type: claim
status: FORMALIZED
title: Rule validation requires an independent evidence path when rule generation depends on the target conflict
scope: Research Library provenance and verification history; concerns epistemic independence between rule generation and validation.
statement: When a conflict-resolution rule is generated or materially modified using evidence from the same conflict it later resolves, validation of that rule requires an independent evidence path or independently generated test set; otherwise rule generation and validation form a circular epistemic loop.
