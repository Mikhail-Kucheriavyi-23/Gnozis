id: C-0043
type: claim
status: FORMALIZED
title: Semantic equivalence of a replacement dependency requires independent support
scope: Research Library provenance and verification history; concerns claims that a replacement dependency preserves the semantic contract required by a dependent proof.
statement: Declaring a replacement dependency semantically equivalent to the original is itself an epistemic claim and cannot establish its own validity; semantic equivalence must be supported by appropriate evidence or a derivation whose trust assumptions are explicit and independently traceable.
