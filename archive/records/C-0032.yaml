engineering:
  consequence: "Authorization records should encode at least actor/mechanism, permitted operation, target scope, validity interval or version, and authorization provenance. Transition validation should reject authority escalation through scope mismatch."
  gap: "A formal scoped-authorization schema and machine-checkable scope matching rules have not yet been defined for the Research Library."
