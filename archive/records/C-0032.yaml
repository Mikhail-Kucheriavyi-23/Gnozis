id: C-0032
type: claim
status: FORMALIZED
title: Transition authority must be scoped to the authorized object and operation
scope: Research Library provenance and verification history; concerns preventing authority granted for one class of evidence or transition from being generalized to unrelated claims, objects, or operations.
statement: Authorization for an actor or mechanism must specify the object or claim scope and permitted operation; authority to perform one evidence transition or verify one domain does not automatically authorize transitions over unrelated evidence.
