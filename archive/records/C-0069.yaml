id: C-0069
type: claim
status: FORMALIZED
title: Applicability staleness requires an explicit cause taxonomy
scope: Research Library provenance and verification history; concerns distinguishing why a previously accepted normalization applicability decision can no longer be reused.
statement: A stale or invalidated applicability decision should record the cause of loss of applicability, distinguishing at minimum relevant input change, projection or rule change, context change, discovered canonicalization defect, and newly available information; these causes have different implications for historical interpretation and re-evaluation.
