engineering:
  consequence: "Impact analysis should compute or justify the remaining evidentiary support after a dependency failure. A dependency is critical only when its failure removes or sufficiently weakens all admissible support required for the target claim under the defined verification criteria."
  gap: "Formal alternative-path semantics, support sufficiency criteria, and post-failure claim-state calculation have not yet been defined for the Research Library."
