id: C-0049
type: claim
status: FORMALIZED
title: Dependency failure impact must account for alternative support paths
scope: Research Library provenance and verification history; concerns claims supported by multiple evidence or proof paths when one upstream dependency fails.
statement: Failure of a dependency does not necessarily invalidate or materially weaken a target claim when an alternative evidentiary path independently supports the required conclusion; propagation analysis must therefore evaluate surviving support paths rather than assuming one failed path determines the claim outcome.
