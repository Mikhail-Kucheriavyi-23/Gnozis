id: C-0014
type: claim
status: FORMALIZED
title: Regression suites can overfit known counterexamples
scope: Verification reverse-analysis; concerns post-remediation test suites that optimize against previously observed failures without adequately probing nearby or novel failure modes.
statement: Adding regression tests that reproduce known failures can prevent recurrence of those exact cases, but a regression suite can become overfit to known counterexamples and remain inadequate against novel or structurally related failures.
