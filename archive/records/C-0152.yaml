id: C-0152
type: claim
status: FORMALIZED
title: Control nodes are epistemically material when their decisions can alter the evidence space or verification status
scope: Research Library provenance and verification history; concerns control nodes, epistemic influence, evidence-space modification, allocation, validation, and stopping.
statement: A control node is epistemically material when changing its decision can materially alter the accessible or selected evidence space, candidate/test allocation, validator configuration, stopping point, or resulting verification status. Control-node correctness as software behavior is distinct from epistemic adequacy of the allocation or control policy.
