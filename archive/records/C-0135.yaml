id: C-0135
type: claim
status: FORMALIZED
title: Shared evidence creates a dependency across claims and verification paths
scope: Research Library provenance and verification history; concerns common evidence dependencies, apparent independence, and evidence reuse across multiple claims.
statement: When multiple claims or verification paths rely materially on the same evidence source, transformation, assumption, or derived artifact, that shared dependency must be represented explicitly. Distinct paths using shared evidence must not be counted as fully independent evidence merely because their downstream verification procedures differ.
