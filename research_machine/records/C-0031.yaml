id: C-0031
type: claim
status: FORMALIZED
title: Transition authority must itself be provenance-bound
scope: Research Library provenance and verification history; concerns establishing why a particular actor or mechanism was authorized to perform a specific evidence-state transition.
statement: Authority to perform an evidence-state transition should itself be traceable to an explicit policy, role assignment, credential, governance decision, or other authorized provenance; an actor label alone is insufficient evidence of transition authority.
