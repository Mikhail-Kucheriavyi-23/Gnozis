id: C-0087
type: claim
status: FORMALIZED
title: Failure models are versioned hypotheses of failure space, not complete authoritative enumerations
scope: Research Library provenance and verification history; concerns evolution of failure models and historical verification scope.
statement: A failure model represents a scoped and versioned model of anticipated or identified failure modes, not an authoritative enumeration of all possible failures; newly discovered failure modes should evolve the model without retroactively rewriting the scope or result of historical verification.
