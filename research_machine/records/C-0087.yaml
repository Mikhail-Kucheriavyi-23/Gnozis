engineering:
  consequence: "Failure-model evolution should be append-only/versioned: discovered modes create new model versions or revisions, while historical verification remains bound to the model version against which it was performed. Reports should distinguish historical validity from current coverage."
  gap: "Formal failure-model versioning, revision semantics, discovery linkage, migration rules, and criteria for reopening prior verification have not yet been defined."
