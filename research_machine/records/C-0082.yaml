id: C-0082
type: claim
status: FORMALIZED
title: Evidence aggregation must distinguish additive, redundant, and correlated support
scope: Research Library provenance and verification history; concerns aggregation of multiple evidence items and avoidance of inflated support from dependent evidence.
statement: Aggregation of evidential support must distinguish independent/additive evidence from redundant or correlated evidence; support strength or adequacy must not be increased by simple counting or summation when evidence items share provenance, assumptions, failure modes, or common sources.
