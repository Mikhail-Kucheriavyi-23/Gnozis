id: C-0098
type: claim
status: FORMALIZED
title: Resolution-rule applicability must be independently established from the resolution outcome
scope: Research Library provenance and verification history; concerns circular validation of conflict-resolution rules.
statement: The applicability of a conflict-resolution rule to a specific conflict must be established independently of the outcome produced by applying that rule; a successful or coherent resolution result cannot itself serve as evidence that the rule was applicable.
