id: C-0035
type: claim
status: FORMALIZED
title: Supersession is distinct from invalidation
scope: Research Library provenance and verification history; concerns semantic distinction between replacing an artifact with a newer version and establishing that the earlier artifact was false or invalid.
statement: A newer version of a claim, model, evidence interpretation, or artifact can supersede an earlier version without proving that the earlier version was historically invalid; supersession and invalidation must therefore be represented as distinct state transitions and provenance relations.
