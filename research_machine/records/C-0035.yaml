engineering:
  consequence: "Archive state and relation schemas should distinguish SUPERSEDES from INVALIDATES/RETRACTS. A superseded artifact remains historically valid as a record of what was asserted under its prior scope and assumptions unless separate evidence establishes invalidity."
  gap: "Formal state-transition and relation semantics for supersession, invalidation, retraction, and correction have not yet been fully specified."
