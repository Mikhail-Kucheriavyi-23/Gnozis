id: C-0086
type: claim
status: FORMALIZED
title: Verification coverage is relative to the declared failure model
scope: Research Library provenance and verification history; concerns completeness claims for verification and independence coverage.
statement: Verification and independence coverage can be assessed only relative to an explicitly declared failure model; if failure modes are unknown, incomplete, or evolving, the result may establish coverage against the declared model but cannot by itself establish complete coverage of all possible failure modes.
