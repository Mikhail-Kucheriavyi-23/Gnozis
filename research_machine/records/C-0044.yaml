id: C-0044
type: claim
status: FORMALIZED
title: Equivalence evidence must expose dependency on the original artifact
scope: Research Library provenance and verification history; concerns circular or hidden dependency when evidence for semantic equivalence of a replacement dependency relies on the original dependency being replaced.
statement: Evidence supporting semantic equivalence between a replacement dependency and the original must explicitly expose any dependence on the original artifact; otherwise the equivalence evidence may create a circular or falsely independent justification for substitution.
