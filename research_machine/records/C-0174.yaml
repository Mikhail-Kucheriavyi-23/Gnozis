id: C-0174
type: claim
status: FORMALIZED
title: A new observation regime must demonstrate genuine discriminative expansion rather than merely re-encoding existing observations
scope: Research Library provenance and verification history; concerns observation-regime design, expressiveness gain, re-encoding, identifiability, and blind-spot reduction.
statement: Changing representation, implementation, or presentation does not by itself establish a new observation regime. A proposed regime should be evaluated for whether it exposes distinctions between hypotheses that were not accessible under the prior regime. Without such demonstrated discriminative expansion, the apparent regime change may only re-encode existing information and leave the original observational blind spot intact.
