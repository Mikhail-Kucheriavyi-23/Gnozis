id: C-0155
type: claim
status: FORMALIZED
title: Authorization policy is a distinct control layer and must not be conflated with verification evidence
scope: Research Library provenance and verification history; concerns authorization policy, commit control, verification evidence, trust boundaries, and action permission.
statement: A policy that determines whether a residual verification state is permitted to commit is a distinct control layer from the evidence and verification result used to describe that state. Authorization policy may legitimately encode action constraints beyond truth or verification status, but its provenance, authority, scope, and decision rationale must remain explicit. A commit authorization decision must not be represented as additional verification evidence.
