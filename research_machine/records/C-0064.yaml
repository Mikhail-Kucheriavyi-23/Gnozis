title: Normalization is admissible only when semantic invariance is established
scope: Research Library provenance and verification history; concerns distinguishing semantics-preserving normalization from transformations that may alter claim meaning.
statement: A normalization rule may be applied automatically only when its semantic invariance relative to the declared claim projection is established; transformations whose semantic preservation is unknown or context-dependent must not be treated as neutral normalization.
