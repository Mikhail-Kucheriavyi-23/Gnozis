id: C-0041
type: claim
status: FORMALIZED
title: A replacement dependency must satisfy the proof interface contract
scope: Research Library provenance and verification history; concerns replacing a prerequisite while preserving the assumptions and input/output contract required by dependent proof artifacts.
statement: Replacing a dependency with a distinct dependency is insufficient merely because the replacement is independently valid; the replacement must also satisfy the interface, assumptions, semantic contract, and scope required by each dependent proof, or those proofs must be re-derived.
