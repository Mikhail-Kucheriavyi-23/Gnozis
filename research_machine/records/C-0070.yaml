id: C-0070
type: claim
status: FORMALIZED
title: Re-evaluation must preserve historical applicability decisions as immutable derived artifacts
scope: Research Library provenance and verification history; concerns append-only lifecycle of applicability decisions and reproducibility of historical evaluations.
statement: Re-evaluation of an applicability decision must create a new derived decision artifact and preserve the prior decision unchanged; historical applicability must remain reconstructible under the inputs, rules, projection, and context that produced it.
