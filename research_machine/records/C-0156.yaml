id: C-0156
type: claim
status: FORMALIZED
title: Conflicts between verification status and authorization policy must remain explicit rather than rewriting verification results
scope: Research Library provenance and verification history; concerns verification-policy conflicts, epistemic integrity, authorization, and tension preservation.
statement: When verification status and authorization policy produce conflicting outcomes, the conflict is itself an explicit system state. Authorization constraints must not rewrite, downgrade, or upgrade verification results merely to eliminate the conflict. The system should preserve the independent provenance and semantics of both states and route the tension to an explicit resolution or escalation mechanism.
