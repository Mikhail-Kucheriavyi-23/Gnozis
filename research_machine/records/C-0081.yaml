id: C-0081
type: claim
status: FORMALIZED
title: Evidential support is scoped and graded rather than a bare binary relation
scope: Research Library provenance and verification history; concerns semantic adequacy and scope of evidence-support relations.
statement: An evidence-support relation must preserve the claim scope, evidence type, relevance, independence or dependency conditions, and an explicit support or adequacy status; the existence of a SUPPORTS edge alone must not be interpreted as proof or sufficient verification.
