title: Scoped proofs require a composition argument before supporting a broader claim
scope: Verification reverse-analysis; concerns combining multiple bounded or local verification results into a larger semantic or global property.
statement: Multiple individually valid scoped proofs do not by themselves establish a broader composed property unless the domains, interfaces, assumptions, and composition rule connecting those proofs are explicitly defined and shown to preserve the target property.
