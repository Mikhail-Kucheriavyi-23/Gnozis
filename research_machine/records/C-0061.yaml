id: C-0061
type: claim
status: FORMALIZED
title: Transition classification requires explicit provenance and derivation criteria
scope: Research Library provenance and verification history; concerns classification of changes between claim states and content identities.
statement: A transition class must not be treated as authoritative merely because it is stored as metadata; its assignment must reference explicit comparison criteria, relevant state fields, and provenance sufficient to reconstruct why the transition was classified as identity-only, semantic, canonicalization-related, correction-related, or another defined class.
