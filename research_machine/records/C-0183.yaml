id: C-0183
type: claim
status: FORMALIZED
title: Verification criterion revision is a distinct epistemic event requiring independent provenance and impact analysis
scope: Research Library provenance and verification history; concerns criterion revision, evidence evaluation, role separation, authority control, and result contamination.
statement: Changing a verification criterion after evidence has been observed changes the conditions under which the evidence is evaluated and must therefore be represented as a distinct epistemic event. Its rationale, authorization, available evidence, and effect on prior results should be separately recorded. Criterion revision should not be silently merged into ordinary evidence evaluation.
