id: C-0016
type: claim
status: FORMALIZED
title: Oracle observability is not equivalent to semantic observability
scope: Verification reverse-analysis; distinguishes properties that can be directly observed or measured from the broader semantic property the system is intended to preserve.
statement: A property that is observable through an available oracle, metric, test, or relation may cover only a projection of the intended semantics; observability of the proxy does not establish observability or preservation of the full semantic property.
