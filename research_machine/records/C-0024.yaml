engineering:
  consequence: "Each proof artifact should expose its assumptions, dependencies, scope, and required preconditions. Composition should check compatibility explicitly and reject composition when assumptions conflict or when required dependencies are unverified."
  gap: "A formal assumption/dependency vocabulary and compatibility checker for Gnozis proof artifacts have not yet been defined."
