id: C-0024
type: claim
status: FORMALIZED
title: Proof composition requires explicit compatibility of assumptions
scope: Verification reverse-analysis; concerns whether local or bounded proofs can be composed when they depend on different or potentially conflicting assumptions.
statement: Individually valid proofs cannot be safely composed when their assumptions are incompatible, mutually dependent in an untracked way, or silently differ in scope; composition requires explicit identification and compatibility checking of assumptions and dependencies.
