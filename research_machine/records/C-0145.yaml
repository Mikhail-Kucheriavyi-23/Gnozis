id: C-0145
type: claim
status: FORMALIZED
title: Challenge selection should account for potential invalidation, not only expected information gain
scope: Research Library provenance and verification history; concerns adversarial challenge selection, falsification potential, model challenge prioritization, and verification robustness.
statement: Selection of subsequent model or evidence challenges should consider their potential to materially alter, weaken, or invalidate the current verification status in addition to expected information gain. A process optimized only for information gain can repeatedly explore low-impact regions while leaving high-impact falsification paths insufficiently challenged.
