id: C-0179
type: claim
status: FORMALIZED
title: Evidence-applicability assessment after evolution is itself an epistemic claim requiring provenance and constrained validation
scope: Research Library provenance and verification history; concerns change-impact analysis, applicability claims, constrained validation, self-assessment, and residual uncertainty.
statement: The classification of historical evidence as still applicable, conditional, requiring revalidation, invalidated, or unknown is itself an epistemic claim. Its basis must therefore be traceable to evidence, dependencies, assumptions, and validation constraints. An evolving system should not silently convert unresolved applicability into continued validity using only its current policy state.
