id: C-0007
type: claim
status: FORMALIZED
title: Verification optimization can overfit the verification criteria
scope: Verification and evolution reverse-analysis; concerns systems that optimize against explicit verification criteria rather than the broader semantic property those criteria are intended to measure.
statement: Optimizing a system or evolution process to satisfy a fixed verification criterion does not by itself establish preservation or improvement of the broader intended property; the criterion can become an optimization target and cease to be an adequate proxy for the target property.
