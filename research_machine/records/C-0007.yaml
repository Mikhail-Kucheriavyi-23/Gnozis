engineering:
  consequence: "Core evolution and verification must distinguish the measured criterion from the intended semantic property and include checks against criterion overfitting or proxy gaming. Passing a known verification target must not be treated as proof of unrestricted semantic improvement."
  gap: "No complete project-specific anti-overfitting criterion has yet been formalized for the semantic properties under study."
