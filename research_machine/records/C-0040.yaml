id: C-0040
type: claim
status: FORMALIZED
title: Remediated dependencies and replacement dependencies are distinct evidence paths
scope: Research Library provenance and verification history; concerns the evidentiary distinction between repairing a failed prerequisite and replacing it with a different independently validated prerequisite.
statement: A re-evaluation that restores a previously failed dependency and a re-evaluation that replaces that dependency with a distinct validated prerequisite are different evidence paths; the archive must preserve which path occurred rather than treating both as an undifferentiated revalidation.
