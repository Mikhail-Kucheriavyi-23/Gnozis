engineering:
  consequence: "Increasing the number of tests using the same observation function is not sufficient to close an observability blind spot. Verification must introduce a genuinely new observable, assumption set, or structurally distinct mechanism when the existing oracle collapses relevant semantic states."
  gap: "A formal criterion for when an additional observable is sufficiently independent or semantically discriminating has not yet been defined for Gnozis."
