id: C-0018
type: claim
status: FORMALIZED
title: Repeated observations within one equivalence class do not remove the blind spot
scope: Verification reverse-analysis; concerns repeated tests or measurements that use an observation function unable to distinguish relevant semantic states.
statement: If an observation mechanism collapses semantically distinct states into the same observable result, repeating measurements that remain within the same observation boundary does not by itself resolve the hidden distinction.
