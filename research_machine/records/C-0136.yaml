id: C-0136
type: claim
status: FORMALIZED
title: Absence of direct evidence sharing does not establish independence under transitive or cyclic dependencies
scope: Research Library provenance and verification history; concerns dependency closure, indirect common ancestry, and circular evidence reuse across verification paths.
statement: Two verification paths can lack a direct shared evidence source while remaining dependent through shared ancestors, derived artifacts, common assumptions, intermediate claims, or cycles in the provenance graph. Independence assessment therefore requires analysis of relevant transitive dependency closure and detection of circular evidence reuse, not only direct edge inspection.
