id: C-0146
type: claim
status: FORMALIZED
title: Adversarial challenge generators constrained by the current model can inherit the model's blind spots
scope: Research Library provenance and verification history; concerns adversarial challenge generation, model independence, blind-spot escape, and circular model challenge.
statement: An adversarial challenge generator whose reachable search space is determined solely or materially by the model under challenge can inherit that model's blind spots and fail to expose omitted regions. Model challenge therefore requires explicit analysis of generator dependence and, where material, alternative or independent challenge mechanisms.
