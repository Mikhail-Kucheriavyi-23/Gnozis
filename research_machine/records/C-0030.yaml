id: C-0030
type: claim
status: FORMALIZED
title: Evidence-state transitions require explicit authority boundaries
scope: Research Library provenance and verification history; concerns who or what may create, verify, invalidate, or otherwise transition evidence and claim states.
statement: An evidence-state transition is valid only when performed or authorized by an actor or mechanism permitted for that transition; possession of write access to the archive is not equivalent to epistemic authority to alter evidence validity.
