id: C-0079
type: claim
status: FORMALIZED
title: Causal attribution is itself a derived claim subject to independent provenance
scope: Research Library provenance and verification history; concerns recursive provenance requirements for explanations of compatibility-classification changes.
statement: A causal attribution is a derived claim and therefore requires its own provenance, evidence scope, and validation status; references to the attributed classification result or to the attribution itself cannot serve as its sole supporting evidence.
