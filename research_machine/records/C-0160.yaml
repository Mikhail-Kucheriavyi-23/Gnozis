id: C-0160
type: claim
status: FORMALIZED
title: Verification priority should not be determined by occurrence frequency when rare compositions have materially higher aggregate impact
scope: Research Library provenance and verification history; concerns rare action compositions, aggregate impact, invalidation potential, frequency-based sampling, and verification priority.
statement: Low occurrence frequency is not sufficient evidence of low verification priority. Rare action compositions may require elevated verification priority when their aggregate effect, invalidation potential, shared-resource interaction, or residual uncertainty is materially higher than ordinary compositions. Frequency is one contextual factor, not a complete priority criterion.
