id: C-0175
type: claim
status: FORMALIZED
title: Interventional observation can improve identifiability while changing the observed system, requiring explicit separation of baseline, response, and intervention-induced effects
scope: Research Library provenance and verification history; concerns intervention, causal observation, identifiability, system perturbation, baseline evidence, and interpretation of post-intervention evidence.
statement: An intervention may expose distinctions that passive observation cannot, but the intervention can also alter the state or behavior of the system. Evidence obtained after intervention must therefore distinguish baseline properties, response-to-intervention, and changes induced by the intervention itself. Post-intervention observations cannot be treated as direct observations of the unperturbed system without additional justification.
