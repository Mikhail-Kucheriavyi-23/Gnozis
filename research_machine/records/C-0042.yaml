id: C-0042
type: claim
status: FORMALIZED
title: Interface compatibility does not establish semantic equivalence
scope: Research Library provenance and verification history; concerns replacement dependencies whose structural input/output contract matches while their semantic interpretation differs.
statement: A replacement dependency may satisfy the same structural input/output interface while producing semantically different results; therefore structural compatibility is insufficient to preserve dependent proof validity unless the required semantic contract is also established.
