title: Counterexample discovery does not by itself localize the failure
scope: Verification reverse-analysis; concerns the distinction between detecting a violated property and identifying the responsible layer, assumption, transition, dependency, or oracle.
statement: Finding a counterexample establishes that a candidate property or verification expectation fails for some case, but does not by itself identify the cause, responsible layer, or minimal failing condition.
