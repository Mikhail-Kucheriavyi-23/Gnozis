id: C-0097
type: claim
status: FORMALIZED
title: Conflict-resolution rules require their own scope, rationale, provenance, and validation
scope: Research Library provenance and verification history; concerns authorization and validity of rules used to resolve verification conflicts.
statement: A conflict-resolution rule is itself a derived or authorized decision rule whose applicability and adequacy must be established separately; the existence of a rule does not prove that applying it to a particular conflict is valid. The rule must have declared scope, rationale, provenance, and validation status.
