id: C-0100
type: claim
status: FORMALIZED
title: Evidence independence is a dependency property, not merely a provenance-label property
scope: Research Library provenance and verification history; concerns independence of evidence paths used to validate generated rules and verification claims.
statement: Independence between validation evidence paths cannot be established solely by distinct provenance labels or separate records; shared data, assumptions, generators, transformations, failure models, or common-mode mechanisms may create epistemic dependence. Independence must therefore be evaluated relative to the claim and declared validation scope.
