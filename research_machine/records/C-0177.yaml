id: C-0177
type: claim
status: FORMALIZED
title: Historical evidence requires temporal transport justification before supporting claims about an evolved system state
scope: Research Library provenance and verification history; concerns temporal transportability, system evolution, evidence validity, invariant preservation, and stale evidence.
statement: Evidence established for a system state at time t does not automatically support the same claim for a later evolved state. Transport across time requires justification that relevant invariants, dependencies, observation conditions, and failure modes remain sufficiently preserved; otherwise historical evidence must retain a bounded temporal scope and residual uncertainty about its applicability.
