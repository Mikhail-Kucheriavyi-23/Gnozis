id: C-0051
type: claim
status: FORMALIZED
title: Verification criteria must be versioned and provenance-bound
scope: Research Library provenance and verification history; concerns changes to the rule or criterion used to determine whether a claim satisfies verification requirements.
statement: A verification criterion is part of the epistemic conditions under which a verification result is valid; therefore criteria must have stable versioned identity and provenance, and changing a criterion must not silently alter the status or meaning of a prior verification result.
