engineering:
  consequence: "Verification results should reference an immutable criterion/version identifier. Criterion changes should create a new criterion version and trigger explicit re-evaluation of affected claims where required."
  gap: "A formal criterion schema, version transition model, and impact propagation rules for criterion changes have not yet been defined for the Research Library."
