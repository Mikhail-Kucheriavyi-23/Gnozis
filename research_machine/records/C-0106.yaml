title: Risk acceptance cannot upgrade the epistemic status of an underlying claim
scope: Research Library provenance and verification history; concerns separation of governance outcomes from epistemic verification states.
statement: Acceptance of a residual risk is a governance outcome and must not change the epistemic status of the underlying claim; UNKNOWN, UNVERIFIED, or UNRESOLVED evidence states remain such unless independently satisfied by evidence and verification criteria.
