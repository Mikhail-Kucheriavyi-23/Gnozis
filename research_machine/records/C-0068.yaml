id: C-0068
type: claim
status: FORMALIZED
title: Applicability decisions are state-relative derived artifacts
scope: Research Library provenance and verification history; concerns staleness and validity of normalization applicability decisions when their inputs evolve.
statement: A normalization applicability decision is valid only relative to the specific versions or states of its projection, semantic context, invariance contract, criteria, and relevant inputs; changes to any verification-relevant input may invalidate or require re-evaluation of the prior decision.
