id: C-0120
type: claim
status: FORMALIZED
title: Independence claims must be bounded by an explicit dependency and common-mode model
scope: Research Library provenance and verification history; concerns bounded independence claims across verification paths.
statement: A claim that verification paths are independent or sufficiently diverse must be scoped to an explicit dependency/common-mode model and the failure classes it covers; independence should be expressed as a bounded epistemic claim rather than as an absolute property inferred from absence of detected correlation.
