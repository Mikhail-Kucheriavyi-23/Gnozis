id: C-0084
type: claim
status: FORMALIZED
title: Evidence independence must be evaluated against a declared relevant dimension and scope
scope: Research Library provenance and verification history; concerns operational definition of independence for verification and evidence aggregation.
statement: Independence assessment need not establish unrestricted independence across every possible dependency dimension; it must identify the dimension or dimensions relevant to the verification claim and evaluate independence within an explicitly declared scope.
