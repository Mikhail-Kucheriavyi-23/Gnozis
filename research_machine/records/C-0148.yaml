id: C-0148
type: claim
status: FORMALIZED
title: Verification status should remain multidimensional unless aggregation commensurability is established
scope: Research Library provenance and verification history; concerns epistemic status vectors, scalar scores, coverage, diversity, independence, adversarial reach, and residual uncertainty.
statement: Verification status should preserve distinct dimensions such as modeled coverage, evidence diversity, dependency independence, adversarial reach, assumptions, and residual uncertainty unless a validated aggregation rule establishes that these dimensions are commensurable without material information loss. A single scalar score can conceal compensating weaknesses across dimensions and therefore cannot be treated as a neutral summary by default.
