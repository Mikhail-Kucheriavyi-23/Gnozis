id: C-0153
type: claim
status: FORMALIZED
title: Stopping rules are epistemic control decisions because they determine which future evidence remains unobserved
scope: Research Library provenance and verification history; concerns early stopping, unobserved future evidence, verification provenance, and termination policy.
statement: A stopping rule is epistemically material when termination prevents potentially relevant future evidence or challenges from being observed. Termination must therefore be represented as part of verification provenance, with the stopping rationale, remaining candidate evidence space, unresolved high-impact hypotheses, and material assumptions preserved. Unexecuted future evidence must not be treated as irrelevant merely because the process stopped before observing it.
