id: C-0181
type: claim
status: FORMALIZED
title: Verification requires an explicit scoped stopping criterion and should terminate at sufficient justification with bounded residual uncertainty
scope: Research Library provenance and verification history; concerns verification stopping criteria, sufficient justification, uncertainty budgets, recursive validation, and epistemic scope.
statement: Verification cannot be treated as complete merely because a procedure has terminated, nor must it recurse indefinitely. Completion should be defined relative to a claim, assumptions, evidence scope, and an explicit uncertainty tolerance or stopping criterion. A completed verification establishes sufficient justification within that scope while preserving residual uncertainty rather than asserting absolute truth.
