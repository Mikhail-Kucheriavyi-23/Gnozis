id: C-0140
type: claim
status: FORMALIZED
title: Selection and allocation influence become epistemically relevant when claim-dependent decisions alter the evidence search space
scope: Research Library provenance and verification history; concerns claim-dependent selection, filtering, sampling, test generation, validator configuration, and budget allocation.
statement: Selection, filtering, sampling, test-generation, validator-configuration, and budget-allocation decisions are epistemically relevant influence edges when they depend materially on the claim under verification and alter which evidence can be produced, observed, retained, or evaluated. Such influence must be represented when assessing circular justification and evidence independence.
