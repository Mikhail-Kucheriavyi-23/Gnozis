title: Verification-relevant semantic projection must be explicit and versioned
scope: Research Library provenance and verification history; concerns the canonical projection used to derive immutable claim-state identity.
statement: The set of claim-state fields treated as verification-relevant must itself be explicitly specified, versioned, and provenance-bound; otherwise changes in canonicalization rules can silently change content identity or cause distinct epistemic states to collide.
