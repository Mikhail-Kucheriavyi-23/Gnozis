id: C-0054
type: claim
status: FORMALIZED
title: Claim identity, content state, and lineage must be distinguished
scope: Research Library provenance and verification history; concerns identifying exactly what proposition was verified and how later claim changes relate to the verified predecessor.
statement: A claim identifier alone is insufficient to establish verification applicability. The archive must distinguish stable claim identity from the content/state of a claim and from its lineage of revisions, so a verification result can be bound to the exact proposition, assumptions, scope, and predecessor relationship that were actually verified.
