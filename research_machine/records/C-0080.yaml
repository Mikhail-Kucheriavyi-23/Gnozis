engineering:
  consequence: "The Research Library should use distinct relation types for derivation/provenance and evidential support. A derived artifact may depend on another artifact computationally or semantically without that dependency being sufficient evidence for the artifact's truth."
  gap: "Formal provenance-dependency versus evidence-support relation semantics, admissibility rules, and graph validation constraints have not yet been defined."
