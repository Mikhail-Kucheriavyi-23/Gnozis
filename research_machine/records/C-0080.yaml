id: C-0080
type: claim
status: FORMALIZED
title: Provenance dependency and evidential support are distinct relations
scope: Research Library provenance and verification history; concerns the semantic distinction between derivation lineage and evidence sufficiency.
statement: A provenance dependency records which artifacts or inputs contributed to the derivation of an artifact, while evidential support asserts that an item supports the truth or validity of a claim; provenance dependency alone does not establish evidential sufficiency.
