id: C-0182
type: claim
status: FORMALIZED
title: Verification stopping thresholds should be precommitted or otherwise constrained before result evaluation, with explicit governance for justified revision
scope: Research Library provenance and verification history; concerns stopping criteria, precommitment, threshold adaptation, verification overfitting, and controlled revision.
statement: A stopping threshold selected after observing verification results can be adapted to fit the evidence and weaken the meaning of completion. Therefore stopping criteria should be precommitted or constrained before result evaluation. Revision may be necessary when the original criterion is demonstrably inapplicable, but such revision must have an explicit, traceable basis and must not be selected merely to accept the observed result.
