id: C-0132
type: claim
status: FORMALIZED
title: Insufficient verification budget cannot be represented as adequate verification
scope: Research Library provenance and verification history; concerns infeasible mandatory coverage requirements, budget exhaustion, escalation, and explicit scope reduction.
statement: When available verification budget is insufficient to satisfy mandatory coverage requirements, no valid allocation exists for the declared verification scope. The system must not represent budget exhaustion as adequacy; it must escalate, defer, or explicitly reduce the claim scope and create a new bounded claim whose requirements are feasible.
