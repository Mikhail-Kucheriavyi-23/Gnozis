id: C-0159
type: claim
status: FORMALIZED
title: Compositional coverage requires explicit sampling of aggregate-risk regions when exhaustive action-space verification is infeasible
scope: Research Library provenance and verification history; concerns action-composition spaces, sampling, aggregate risk, local versus compositional coverage, and control-driven test selection.
statement: When exhaustive verification of all relevant action compositions is infeasible, sampled compositional verification does not establish complete compositional safety. Composition sampling should prioritize materially distinct aggregate-effect regions, dependency/order interactions, shared-resource interactions, and combinations with high potential to invalidate authorization assumptions. Sampling decisions themselves require provenance.
