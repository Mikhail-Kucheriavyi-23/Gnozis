id: C-0013
type: claim
status: FORMALIZED
title: Re-verification must test the correction beyond the original failure case
scope: Verification reverse-analysis; concerns verification after remediation of a discovered counterexample or defect.
statement: Re-running the original failing case after a correction can establish that the observed failure no longer occurs in that case, but does not by itself establish that the correction is causally adequate, generalizes beyond the original case, or preserves other required properties.
