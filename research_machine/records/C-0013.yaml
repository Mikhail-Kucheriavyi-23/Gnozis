engineering:
  consequence: "After remediation, verification should include the original counterexample, regression cases, boundary/adversarial variants, and checks for preservation of unrelated required properties. Passing only the original reproducer is insufficient for a general correction claim."
  gap: "A project-specific post-remediation verification protocol and adequacy boundary have not yet been fully formalized."
