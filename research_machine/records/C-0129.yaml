id: C-0129
type: claim
status: FORMALIZED
title: Verification budget creates a breadth-depth tradeoff that must be explicit in bounded robustness claims
scope: Research Library provenance and verification history; concerns allocation of limited verification resources across counterfactual classes, adversarial search, common-mode challenge, and model adequacy.
statement: Under finite verification resources, coverage breadth, challenge depth, adversarial search, and common-mode/model-adequacy analysis compete for budget. A bounded robustness claim must therefore record the tested domains, budget allocation or stopping basis, and relevant unexplored regions rather than treating the observed test count as equivalent to completeness.
