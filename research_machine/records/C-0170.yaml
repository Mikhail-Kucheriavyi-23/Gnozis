title: Independence assessment is bounded by the adequacy of dependency discovery and must preserve uncertainty about undiscovered common causes
scope: Research Library provenance and verification history; concerns dependency discovery, undiscovered dependencies, epistemic independence, common causes, and residual uncertainty.
statement: Failure to identify a dependency does not establish its absence. Claims of epistemic independence are therefore bounded by the adequacy and scope of the dependency-discovery process, including its own blind spots. Where common dependencies may remain undiscovered, residual uncertainty about independence must remain explicit.
