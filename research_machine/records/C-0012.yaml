id: C-0012
type: claim
status: FORMALIZED
title: Counterexample minimization improves failure diagnosis but does not prove causality
scope: Verification reverse-analysis; concerns reduction of a failing case and the distinction between isolating a minimal failure condition and establishing a causal explanation.
statement: Reducing a counterexample to a smaller or minimal failing case can improve localization and diagnosis, but minimality of the observed failure does not by itself establish causal sufficiency or identify the unique cause.
