id: C-0073
type: claim
status: FORMALIZED
title: Structural lineage validity and epistemic consistency are distinct validation layers
scope: Research Library provenance and verification history; concerns separation of graph-structural validation from semantic or epistemic consistency analysis.
statement: A decision lineage graph can be structurally valid while containing semantically incompatible claims or decisions; therefore relation-graph validity and epistemic consistency must be represented and evaluated as distinct validation layers.
