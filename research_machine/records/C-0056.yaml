id: C-0056
type: claim
status: FORMALIZED
title: Claim content identity must bind all verification-relevant semantics and assumptions
scope: Research Library provenance and verification history; concerns whether a content hash or canonical identity captures every field whose change could alter verification applicability.
statement: An immutable content identity is sufficient for exact claim-state identification only if canonical content includes every semantic, scope, assumption, dependency, and verification-relevant field whose change could alter the meaning or applicability of the claim; omitted verification-relevant fields create identity collisions at the epistemic layer even when the serialized record differs elsewhere.
