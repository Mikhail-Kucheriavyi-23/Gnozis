id: C-0103
type: claim
status: FORMALIZED
title: Independence assessment adequacy is relative to the common-mode risks relevant to the verification claim
scope: Research Library provenance and verification history; concerns adequacy of dependency analysis used to support evidence-independence claims.
statement: An independence assessment is adequate only relative to the dependency domains and common-mode failure risks relevant to the verification claim and declared scope; absence of detected dependency after an inadequate or irrelevant analysis cannot provide sufficient support for treating evidence paths as independent.
