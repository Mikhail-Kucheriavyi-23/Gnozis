id: C-0169
type: claim
status: FORMALIZED
title: Claims of independence or non-circularity require separately justified evidence and explicit residual uncertainty
scope: Research Library provenance and verification history; concerns independence claims, non-circular validation, trust boundaries, meta-evidence, and residual uncertainty.
statement: A claim that an evidence source is independent or that a validation path is non-circular cannot be established solely by the mechanism under evaluation. The claim requires separately justified evidence about relevant dependencies and validation boundaries; where such justification is incomplete, residual uncertainty must remain explicit rather than being converted into a binary trust state.
