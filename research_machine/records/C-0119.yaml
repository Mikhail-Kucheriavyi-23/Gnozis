title: Apparent verification diversity does not establish independence when challenge paths share common-mode failure sources
scope: Research Library provenance and verification history; concerns correlation and common-mode failure across multiple model adequacy challenges.
statement: Multiple verification or challenge paths should not be treated as independent merely because their implementations or agents differ; shared assumptions, evidence sources, model components, omitted domains, or infrastructure can create common-mode failure that invalidates naive independence claims.
