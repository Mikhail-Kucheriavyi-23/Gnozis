id: C-0015
type: claim
status: FORMALIZED
title: Relational or metamorphic verification can test properties without a complete oracle
scope: Verification reverse-analysis; concerns properties expressible as relations between executions or transformations when an exact expected output is unavailable.
statement: When a complete oracle for the correct output is unavailable, a verification relation between multiple executions, transformed inputs, states, or outputs can provide a falsifiable property to test, but satisfaction of that relation does not by itself establish the full intended semantics.
