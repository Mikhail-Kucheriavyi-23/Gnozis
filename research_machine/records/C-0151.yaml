id: C-0151
type: claim
status: FORMALIZED
title: Meta-verification escalation should be triggered by material influence, not recursion alone
scope: Research Library provenance and verification history; concerns meta-level escalation, recursive verification, controller uncertainty, and material influence.
statement: The existence of a recursive dependency or additional meta-level does not by itself require indefinite escalation. Escalation is warranted when uncertainty, bias, or failure in a controlling verification mechanism can materially alter the current claim's verification status. Meta-level depth alone is not a sufficient stopping or escalation criterion.
