id: C-0164
type: claim
status: FORMALIZED
title: Epistemic independence is claim-, failure-mode-, and scope-relative rather than an absolute property of evidence sources
scope: Research Library provenance and verification history; concerns epistemic independence, common-mode failure, claim scope, failure-mode scope, and evidence interpretation.
statement: Independence between evidence sources or challenge generators should be stated relative to a specified claim, failure mode, and scope. Sources may be independent with respect to one failure mode while sharing assumptions or dependencies relevant to another. Therefore an unqualified global independence claim is insufficient for verification adequacy.
