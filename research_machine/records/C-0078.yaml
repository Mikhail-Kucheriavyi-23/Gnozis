id: C-0078
type: claim
status: FORMALIZED
title: Causal attribution is evidence-scoped and cannot substitute for compatibility evidence
scope: Research Library provenance and verification history; concerns epistemic scope of causal explanations for changed compatibility classifications.
statement: A causal attribution explaining why a compatibility classification changed is a derived explanation with its own evidence and provenance scope; it does not by itself establish the truth of the underlying claims, their compatibility, or contradiction.
