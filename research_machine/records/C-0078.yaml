engineering:
  consequence: "Causal attribution records should declare their evidence scope and provenance independently from compatibility classification. A well-supported explanation of a classification transition must not be promoted into evidence that the classified semantic relation itself is true."
  gap: "Formal evidence-scope schema, causal attribution confidence/status, and separation rules between causal explanation and compatibility evidence have not yet been defined for the Research Library."
