id: C-0126
type: claim
status: FORMALIZED
title: Semantic impact propagation must account for acceptance logic, not merely graph adjacency
scope: Research Library provenance and verification history; concerns determining which operational acceptances are materially affected by epistemic revisions.
statement: A dependency edge between an epistemic claim and an operational acceptance does not by itself establish material impact. Reassessment must account for the acceptance's logical dependency structure, policy conditions, and whether the revised claim can change the acceptance result within its declared scope.
