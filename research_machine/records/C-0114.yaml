title: Unresolved epistemic conflict should be contained to its affected scope unless it invalidates a declared global invariant
scope: Research Library provenance and verification history; concerns containment of unresolved concurrent conflicts and prevention of unjustified global state effects.
statement: An unresolved epistemic conflict should affect only the state and claims within its demonstrated dependency/impact scope; it should not automatically force a global stop or global invalidation unless the conflict reaches a declared global invariant, authority boundary, or dependency required by the global claim.
