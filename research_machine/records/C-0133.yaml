id: C-0133
type: claim
status: FORMALIZED
title: Scope, mandatory coverage, and budget changes constitute verification-contract changes rather than ordinary progress
scope: Research Library provenance and verification history; concerns integrity of verification runs under changing scope, coverage requirements, and resource constraints.
statement: Changes to declared claim scope, mandatory coverage requirements, acceptance thresholds, or verification budget alter the verification contract and must be versioned and explicitly attributed. They must not be recorded merely as progress within the same verification run, because doing so can make adequacy appear to improve through silent relaxation of requirements.
