id: C-0123
type: claim
status: FORMALIZED
title: Epistemic status and operational acceptance are distinct dimensions
scope: Research Library provenance and verification history; concerns separation of truth/evidence status from governance or operational-use decisions.
statement: An operational acceptance threshold may determine whether an epistemically uncertain or bounded claim is permitted for a specified use, but it must not alter the underlying epistemic status or retroactively convert unresolved or uncertain evidence into verification.
