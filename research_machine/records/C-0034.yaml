engineering:
  consequence: "Authorization records should bind to immutable object/version identifiers. A version change should require re-authorization, explicit inheritance, or a machine-checkable equivalence rule; silent authorization carry-over must be rejected."
  gap: "Formal version-transition semantics, authorization inheritance rules, and equivalence criteria have not yet been defined for the Research Library."
