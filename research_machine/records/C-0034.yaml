id: C-0034
type: claim
status: FORMALIZED
title: Authorization does not automatically transfer across object versions
scope: Research Library provenance and verification history; concerns authorization validity when the target claim, evidence artifact, or object changes version.
statement: Authorization bound to a specific object version must not automatically apply to a later or materially different version unless an explicit and traceable rule permits the transfer and establishes that the authorized scope remains valid.
