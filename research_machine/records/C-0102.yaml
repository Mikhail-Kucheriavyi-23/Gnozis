id: C-0102
type: claim
status: FORMALIZED
title: Failure to detect shared dependencies does not establish evidence independence
scope: Research Library provenance and verification history; concerns uncertainty and scope in independence assessment.
statement: Absence of an identified shared ancestor or common-mode mechanism does not establish evidence independence; independence assessment must retain its scope, assumptions, search coverage, and uncertainty, and should distinguish no detected dependency from demonstrated independence.
