engineering:
  consequence: "Independence assessments should expose examined dependency domains, excluded domains, assumptions, search depth, and residual uncertainty. A result such as NO_DETECTED_DEPENDENCY should not be normalized to INDEPENDENT without additional evidence."
  gap: "Formal independence-state taxonomy, dependency-search completeness criteria, uncertainty representation, and admissibility thresholds for claiming independence have not yet been defined."
