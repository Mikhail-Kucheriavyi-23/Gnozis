id: C-0171
type: claim
status: FORMALIZED
title: Unresolved shared-dependency hypotheses should remain explicit and can guide discriminating verification
scope: Research Library provenance and verification history; concerns unknown dependencies, competing hypotheses, discriminating evidence, adaptive verification, and residual uncertainty.
statement: When available evidence cannot determine whether a common dependency exists, the system should preserve competing hypotheses rather than treating the dependency as absent. Verification may then prioritize tests or observations with the capacity to discriminate between those hypotheses, while preserving residual uncertainty until the evidence supports a justified update.
