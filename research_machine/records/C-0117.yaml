id: C-0117
type: claim
status: FORMALIZED
title: Correct inference within a model does not establish model adequacy for the claim
scope: Research Library provenance and verification history; concerns adequacy of dependency/impact models used for epistemic conclusions.
statement: A conclusion may be correctly derived under a given model while the model itself remains inadequate for the claim or scope; model adequacy therefore requires separate assessment of relevant assumptions, omitted dependency classes, scope coverage, failure modes, and known limitations.
