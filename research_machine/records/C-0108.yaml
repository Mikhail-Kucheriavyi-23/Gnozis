title: Historical epistemic transitions must retain the semantics version under which they were evaluated
scope: Research Library provenance and verification history; concerns versioning and immutability of transition predicates.
statement: An epistemic state transition must retain the versioned transition semantics, verification predicate, or rule definition under which its admissibility was evaluated; later changes to transition semantics must not silently reinterpret historical transitions.
