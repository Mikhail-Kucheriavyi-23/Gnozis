engineering:
  consequence: "Containment assessments should record the dependency model, traversal scope/depth, examined paths, excluded domains, assumptions, and residual uncertainty. A boundary should not be treated as proven merely because traversal returned no additional nodes."
  gap: "Formal reachability semantics, impact-edge taxonomy, completeness criteria, hidden-edge handling, and admissibility thresholds for non-impact claims have not yet been defined."
