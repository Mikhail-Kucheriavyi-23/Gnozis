id: C-0115
type: claim
status: FORMALIZED
title: Containment boundaries require scoped reachability evidence and must distinguish unobserved reachability from demonstrated non-impact
scope: Research Library provenance and verification history; concerns proving that an unresolved conflict does not affect claims outside its containment boundary.
statement: A containment boundary for an unresolved epistemic conflict requires evidence that relevant impact paths have been examined within the declared dependency model and scope; failure to find an outgoing path does not by itself establish absence of impact outside the analyzed domain.
