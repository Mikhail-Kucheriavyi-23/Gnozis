id: C-0077
type: claim
status: FORMALIZED
title: Compatibility result changes may have multiple simultaneous changed inputs
scope: Research Library provenance and verification history; concerns attribution when multiple classification-relevant inputs change between evaluations.
statement: When multiple compatibility-evaluation inputs change between evaluations, provenance must preserve the full set of changed inputs and must not collapse them into a single causal explanation unless an independently supported causal analysis establishes such attribution.
