engineering:
  consequence: "Attribution records should represent changed-input sets explicitly and distinguish observed co-change from causal attribution. A classification transition may remain causally unresolved even when all changed inputs are known."
  gap: "Formal changed-input set schema, causal attribution criteria, interaction handling, and unresolved-attribution status have not yet been defined for the Research Library."
