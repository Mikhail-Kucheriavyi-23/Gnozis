id: C-0047
type: claim
status: FORMALIZED
title: Shared upstream dependencies require impact classification
scope: Research Library provenance and verification history; concerns classification of shared dependencies between evidence paths by whether they can jointly determine or materially affect the supported conclusion.
statement: Shared upstream dependencies should be classified by evidentiary impact rather than treated as a binary condition; a shared dependency may be critical, material, or peripheral depending on whether failure of the shared component can jointly invalidate, materially weaken, or only contextually affect the evidence paths.
