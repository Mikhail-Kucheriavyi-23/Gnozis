id: C-0050
type: claim
status: FORMALIZED
title: Surviving support is sufficient only relative to the claim's verification criterion
scope: Research Library provenance and verification history; concerns determining whether remaining evidence paths after a dependency failure still satisfy the verification requirements of a specific claim.
statement: The sufficiency of surviving evidentiary support must be evaluated against the explicit verification criterion of the target claim; the number of surviving paths, their apparent diversity, or their existence alone does not establish that the claim remains verified.
