engineering:
  consequence: "Each claim should expose an explicit verification criterion or admissibility rule. Post-failure analysis must evaluate surviving support against that criterion rather than using path count or generic confidence as a substitute."
  gap: "A formal verification-criterion schema and machine-checkable support-sufficiency semantics have not yet been defined for the Research Library."
