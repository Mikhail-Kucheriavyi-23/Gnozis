id: C-0137
type: claim
status: FORMALIZED
title: Dependency graphs require typed edge semantics for cycle validity and epistemic interpretation
scope: Research Library provenance and verification history; concerns typed provenance/dependency graphs, legitimate evolutionary feedback, and prohibited self-support cycles.
statement: Dependency edges must carry semantic types because cycle admissibility and epistemic meaning depend on whether an edge represents derivation, support, validation, dependency, feedback, or another relation. A global rule forbidding all cycles would incorrectly reject legitimate evolutionary feedback, while allowing all cycles could permit evidence self-support. Cycle policy must therefore be defined per edge type and claim/provenance role.
