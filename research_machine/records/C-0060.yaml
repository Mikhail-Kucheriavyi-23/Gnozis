id: C-0060
type: claim
status: FORMALIZED
title: Content identity change does not by itself establish proposition change
scope: Research Library provenance and verification history; concerns distinguishing changes in canonical content identity from changes in the proposition itself.
statement: A change in claim-state ContentID does not by itself establish that the proposition, scope, assumptions, or verification semantics changed; ContentID may change solely because canonicalization or semantic-projection rules changed. Proposition change must therefore be established from explicit semantic comparison or lineage metadata, not inferred from ContentID inequality alone.
