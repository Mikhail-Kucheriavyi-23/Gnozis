id: C-0134
type: claim
status: FORMALIZED
title: Evidence reuse across verification-contract revisions requires relevance and validity checks and does not inherit verification status
scope: Research Library provenance and verification history; concerns reuse of prior evidence after changes to scope, coverage, thresholds, budget, or policy.
statement: Evidence produced under a prior verification contract may be reused under a revised contract only after checking its provenance, scope compatibility, assumptions, failure-class coverage, and validity under the new contract. Reused evidence may contribute to a new assessment but must not automatically transfer the prior verification or adequacy status.
