id: C-0028
type: claim
status: FORMALIZED
title: Evidence invalidation must preserve the historical assertion and its status transition
scope: Research Library provenance and verification history; concerns how later-discovered dependency failures alter the status of previously recorded evidence.
statement: When previously recorded evidence or a claim is later invalidated, downgraded, or placed under review, the archive must preserve the original assertion, its original provenance and status, and append the later invalidation event rather than rewriting history.
