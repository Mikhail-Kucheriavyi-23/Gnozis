engineering:
  consequence: "Archive history should be append-only for evidence-state transitions. Current validity may be derived from the latest authorized state, while prior assertions and reasons for status changes remain immutable and traceable."
  gap: "A formal append-only evidence-state transition model, event schema, and authorization rules have not yet been defined for the Research Library."
