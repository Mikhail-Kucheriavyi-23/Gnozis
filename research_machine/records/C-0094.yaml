engineering:
  consequence: "Aggregation specifications should provide explicit propagation rules for each result state and distinguish out-of-scope properties from missing or unverified properties. Aggregate status computation should be deterministic and auditable."
  gap: "Formal state-propagation table, scope-exclusion semantics, conflict precedence, and aggregation algebra have not yet been defined."
