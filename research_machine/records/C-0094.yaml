id: C-0094
type: claim
status: FORMALIZED
title: Aggregate verification requires explicit propagation semantics for result states and scope exclusions
scope: Research Library provenance and verification history; concerns deterministic aggregation of property-level verification results.
statement: An aggregation rule must explicitly define how PASS, FAIL, UNKNOWN, UNVERIFIED, and scope exclusions propagate to the aggregate result; otherwise identical local results may yield materially different aggregate conclusions through implicit logic.
