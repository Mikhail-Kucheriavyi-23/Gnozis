title: Decision lineage relations require source-target and composition constraints
scope: Research Library provenance and verification history; concerns structural validity of typed decision lineage graphs.
statement: Typed decision lineage relations must define admissible source and target states and composition constraints; otherwise a syntactically valid graph can encode semantically impossible or contradictory lifecycle histories.
