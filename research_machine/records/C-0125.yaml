title: Material epistemic revisions should trigger selective reassessment of affected operational acceptances
scope: Research Library provenance and verification history; concerns propagation of material epistemic changes to dependent operational permissions.
statement: A material change to evidence, model, scope, invariant status, or epistemic state should trigger reassessment only for operational acceptances whose declared dependencies or validity conditions are affected or uncertain; unaffected acceptances should remain unchanged unless a demonstrated global invariant or authority dependency requires broader propagation.
